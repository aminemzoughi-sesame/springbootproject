spring.application.name=librairie
server.port=8090
# Connexion à la base H2 (en mémoire)
spring.datasource.url=jdbc:h2:mem:librairie
spring.datasource.username=sa
spring.datasource.password=
# Active la console web de H2
spring.h2.console.enabled=true
# Affiche dans la console les requêtes SQL générées
spring.jpa.show-sql=true
# Hibernate crée les tables au démarrage et les supprime à l'arrêt
spring.jpa.hibernate.ddl-auto=create-drop

# data.sql est exécuté après la création des tables
spring.jpa.defer-datasource-initialization=true

# Lecture de data.sql en UTF-8 (accents)
spring.sql.init.encoding=UTF-8